\* expect: violates MutualExclusion
\* A writer dies holding the lock; two concurrent reapers race on a dead holder's lock: two writers in the critical section.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1, w2, w3}
  Reapers = {r1, r2}
  Readers = {}
  BatchSize = 1
  MaxAttempts = 1
  MaxCrashes = 1
  PidVisible = TRUE
  NoReplace = FALSE
  AtomicReaddir = TRUE
INVARIANTS
  MutualExclusion
