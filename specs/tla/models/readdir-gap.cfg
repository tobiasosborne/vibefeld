\* expect: violates ReaderSeesNoGap
\* Non-atomic readdir (allowed by POSIX): a lock-free reader can see a gap in a healthy ledger.
SPECIFICATION Spec
CONSTANTS
  Writers = {w1}
  Reapers = {}
  Readers = {rd1}
  BatchSize = 2
  MaxAttempts = 1
  MaxCrashes = 0
  PidVisible = TRUE
  NoReplace = FALSE
  AtomicReaddir = FALSE
INVARIANTS
  ReaderSeesNoGap
  NoGap
